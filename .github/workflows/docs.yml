name: Docs

# Builds the VitePress site in website/ and deploys it to GitHub Pages.
# Deploys from develop so the published docs track the full feature set.
# The vendors page embeds the README enforcement matrix at build time, so
# README changes rebuild the site too.
on:
  push:
    branches: [develop]
    paths:
      - "website/**"
      - "README.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile --filter @useparley/website
      - name: Build site
        run: pnpm --filter @useparley/website build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
