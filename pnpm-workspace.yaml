packages:
  - "packages/*"

allowBuilds:
  better-sqlite3: true
  esbuild: true

# pnpm >=10 blocks dependency install scripts by default. better-sqlite3 needs
# its native binary (fetched by its install script) and esbuild (vitest's
# bundler) needs its platform binary, so both are explicitly approved here.
onlyBuiltDependencies:
  - better-sqlite3
  - esbuild
